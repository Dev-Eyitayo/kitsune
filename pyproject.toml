[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitsune-app"
version = "0.1.0"
description = "Shape-shift any website into a standalone, isolated desktop web app using Firefox on Linux"
readme = "README.md"
authors = [{ name = "Eyitayo", email = "ezekieleyitayo2020@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Gnome",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Utilities",
]
keywords = [
    "firefox",
    "pwa",
    "webapp",
    "linux",
    "ubuntu",
    "gnome",
    "cinnamon",
    "wayland",
    "kitsune",
    "site-specific-browser",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/dev-eyitayo/kitsune"
Documentation = "https://github.com/dev-eyitayo/kitsune#readme"
Repository = "https://github.com/dev-eyitayo/kitsune.git"
Issues = "https://github.com/dev-eyitayo/kitsune/issues"

[project.scripts]
kitsune = "kitsune.cli:main"

[tool.setuptools.packages.find]
include = ["kitsune*"]

[tool.setuptools.package-data]
kitsune = ["assets/**/*"]
